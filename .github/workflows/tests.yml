# Runs the unit tests on a clean Windows runner, on the two Python versions the
# package supports. The runner has no Space Engineers 2 Mod SDK, so SE2_MODSDK
# points at a folder that does not exist: tests that need the shipped SDK
# content (or its search index) skip themselves, everything else runs.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    # The runner context is not available in a job's env, only in a step's, so
    # the two paths built from runner.temp are set on the steps that read them.
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          SE2_MODSDK: ${{ runner.temp }}\no-sdk
          SE2_MCP_CACHE: ${{ runner.temp }}\se2-mcp-cache
      - run: python -m se2_mcp --version
        env:
          SE2_MODSDK: ${{ runner.temp }}\no-sdk
          SE2_MCP_CACHE: ${{ runner.temp }}\se2-mcp-cache
